<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #1a1c23;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #262830;
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      max-width: 400px;
      width: 90%;
    }
    h1 { margin-bottom: 0.5rem; font-size: 1.8rem; }
    p { color: #b9bbbe; margin-bottom: 1.5rem; }
    .links a {
      display: block;
      background-color: #5865F2;
      color: white;
      text-decoration: none;
      padding: 0.8rem 1rem;
      border-radius: 6px;
      margin: 0.5rem 0;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    .links a:hover {
      background-color: #4752C4;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>ようこそ！</h1>
    <p>Discordプロフィール用のWebサイトです。</p>
    <div class="links">
      <a href="https://x.com" target="_blank">X (旧Twitter)</a>
      <a href="https://youtube.com" target="_blank">YouTube</a>
      <a href="https://discord.gg/" target="_blank">Discord サーバー</a>
    </div>
  </div>
</body>
</html>
